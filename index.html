<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบค้นหาสิ่งของ</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
*{
    box-sizing:border-box;
    font-family:'Kanit',sans-serif;
}

body{
    margin:0;
    background:#f3f5f7;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
    background:#fff;
    border-radius:15px;
    padding:25px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    margin-top:0;
}

.search-box{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    padding:12px 18px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.status{
    margin:15px 0;
    text-align:center;
    color:#666;
}

.item-card{
    margin-top:20px;
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    background:#fafafa;
    text-align:center;
}

.item-card img{
    width:100%;
    max-height:300px;
    object-fit:contain;
    border-radius:10px;
    margin-bottom:10px;
}

.item-title{
    font-size:20px;
    font-weight:bold;
    color:#007bff;
}

.item-desc{
    white-space:pre-line;
    margin-top:8px;
}

.no-result{
    text-align:center;
    margin-top:20px;
    color:red;
}
</style>
</head>

<body>

<div class="container">

<h2>🔍 ค้นหาสิ่งของ</h2>

<div class="search-box">
<input
type="text"
id="searchInput"
placeholder="พิมพ์ชื่อสิ่งของ..."
onkeypress="handleKeyPress(event)"
>

<button onclick="searchData()">ค้นหา</button>

</div>

<div id="status" class="status">
กำลังโหลดข้อมูล...
</div>

<div id="results"></div>

</div>

<script>

const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSmFBaHF26K4d91043hTxoLR7JxJx5nYcQR7Wi-TJygWQsJ5v5WrMN-Y9KIUgS2J01GKulaaivSyjup/pub?gid=0&single=true&output=csv";

let items=[];

window.onload=function(){

Papa.parse(CSV_URL,{

download:true,

header:true,

skipEmptyLines:true,

complete:function(result){

items=result.data;

document.getElementById("status").innerHTML=
"✅ โหลดข้อมูลแล้ว "+items.length+" รายการ";

},

error:function(){

document.getElementById("status").innerHTML=
"❌ โหลดข้อมูลไม่สำเร็จ";

}

});

};

function convertDriveLink(url){

if(!url) return "";

url=url.trim();

if(url.includes("drive.google.com/file/d/")){

let id=url.match(/\/d\/(.*?)\//);

if(id){

return "https://drive.google.com/thumbnail?id="+id[1]+"&sz=w1200";

}

}

if(url.includes("open?id=")){

let id=url.split("id=")[1];

return "https://drive.google.com/thumbnail?id="+id+"&sz=w1200";

}

if(url.includes("uc?id=")){

let id=url.split("id=")[1];

return "https://drive.google.com/thumbnail?id="+id+"&sz=w1200";

}

return url;

}

function searchData(){

const keyword=document
.getElementById("searchInput")
.value
.trim()
.toLowerCase();

const results=document.getElementById("results");

results.innerHTML="";

if(keyword===""){

results.innerHTML='<div class="no-result">กรุณาพิมพ์คำค้นหา</div>';

return;

}

const found=items.filter(item=>{

const name=
(item.NAME ||
item.Name ||
item["ชื่อ"] ||
"").toLowerCase();

return name.includes(keyword);

});

if(found.length===0){

results.innerHTML='<div class="no-result">ไม่พบข้อมูล</div>';

return;

}

found.forEach(item=>{

const title=item.NAME || item.Name || item["ชื่อ"] || "";

const desc=item.DESCRIPTION || item.Description || item["รายละเอียด"] || "";

let img=item.IMAGEURL || item.ImageUrl || item["รูปภาพ"] || "";

img=convertDriveLink(img);

const div=document.createElement("div");

div.className="item-card";

div.innerHTML=`

<img src="${img}"

onerror="this.outerHTML='<div style=&quot;color:red&quot;>❌ โหลดรูปไม่ได้</div>'">

<div class="item-title">

${title}

</div>

<div class="item-desc">

${desc}

</div>

`;

results.appendChild(div);

});

}

function handleKeyPress(e){

if(e.key==="Enter"){

searchData();

}

}

</script>

</body>
</html>
